  <text x="72" y="292" fill="#16171C" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="-2.6">From a math idea to</text>
  <text x="72" y="358" fill="#16171C" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="-2.6">a scene you can inspect.</text>
  <text x="72" y="439" fill="#5E606B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">Check formulas, sequence, labels, and timing.</text>
  <text x="72" y="471" fill="#5E606B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">Then generate portable Manim Community code.</text>

  <g transform="translate(72 548)">
