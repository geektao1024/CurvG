    <path d="M88 -9L92 -5L88 -1" stroke="#B8BAC4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="0" fill="#73757F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">SCENE PLAN</text>
    <path d="M216 -5H258" stroke="#B8BAC4" stroke-width="1.5"/>
    <path d="M254 -9L258 -5L254 -1" stroke="#B8BAC4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="276" y="0" fill="#4B50D6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">MANIM CODE</text>
  </g>

