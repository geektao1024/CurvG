    <text x="78" y="105" fill="#F4F4FA" font-family="Georgia, serif" font-size="24" font-style="italic">y = sin(x)</text>
    <text x="315" y="231" fill="#8D909D" font-family="Inter, Arial, sans-serif" font-size="11">x</text>
    <text x="48" y="92" fill="#8D909D" font-family="Inter, Arial, sans-serif" font-size="11">y</text>

    <g transform="translate(0 278)">
