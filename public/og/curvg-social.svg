      <text x="10" y="19" fill="#555BE0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">1</text>
      <text x="42" y="12" fill="#26272E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Establish axes and formula</text>
      <text x="42" y="32" fill="#777985" font-family="Inter, Arial, sans-serif" font-size="12">Keep labels within the safe frame</text>
    </g>
    <g transform="translate(0 340)">
      <circle cx="14" cy="14" r="14" fill="#ECECFF"/>
      <text x="10" y="19" fill="#555BE0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">2</text>
      <text x="42" y="12" fill="#26272E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Trace one period of the curve</text>
      <text x="42" y="32" fill="#777985" font-family="Inter, Arial, sans-serif" font-size="12">Review pacing before code generation</text>
    </g>
