    <path d="M32 208H354M65 80V222" stroke="#444753" stroke-width="1"/>
    <path d="M66 174C103 85 145 83 181 174C217 265 259 263 296 174C315 129 333 106 354 106" stroke="#7E83FF" stroke-width="4" stroke-linecap="round"/>
