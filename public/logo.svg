<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CurvG logo">
  <!-- 黑板底 -->
  <rect width="512" height="512" rx="112" fill="#101815"/>
  <!-- 板擦光晕：曲线呼吸的空间 -->
  <circle cx="330" cy="180" r="190" fill="#7dd8c0" opacity="0.05"/>
  <!-- 粉笔螺线：一笔从外向内收拢的黄金螺线手势，笔画由粗渐细 -->
  <path d="M116 332 A156 156 0 1 1 388 232" fill="none" stroke="#7dd8c0" stroke-width="30" stroke-linecap="round"/>
  <path d="M388 232 A96 96 0 0 1 320 300" fill="none" stroke="#7dd8c0" stroke-width="20" stroke-linecap="round"/>
  <path d="M320 300 A54 54 0 0 1 266 262" fill="none" stroke="#7dd8c0" stroke-width="13" stroke-linecap="round"/>
  <!-- 粉笔重影：手绘的第二道虚痕 -->
  <path d="M112 348 A164 164 0 1 1 396 240" fill="none" stroke="#f2f0e6" stroke-opacity="0.14" stroke-width="4" stroke-dasharray="1 22" stroke-linecap="round"/>
  <!-- 琥珀追踪点：笔尖停驻在螺线外端 -->
  <circle cx="116" cy="332" r="26" fill="#e8c477"/>
  <!-- 粉笔灰：落笔时溅起的两粒 -->
  <circle cx="88" cy="384" r="7" fill="#f2f0e6" opacity="0.35"/>
  <circle cx="146" cy="396" r="5" fill="#f2f0e6" opacity="0.22"/>
</svg>
